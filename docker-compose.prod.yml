# Production overlay: gunicorn workers, no dev mounts, always restart.
# Run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
services:
  api:
    command: gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 3 --timeout 60
    volumes: []
    environment:
      APP_ENV: prod
