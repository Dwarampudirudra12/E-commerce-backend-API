services:
  api:
    build: .
    container_name: ecom-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://ecom:ecom@db:5432/ecom
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /code
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/code/app
      - ./alembic:/code/alembic
      - ./scripts:/code/scripts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5

  db:
    image: postgres:15
    container_name: ecom-db
    environment:
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom
      POSTGRES_DB: ecom
    ports:
      - "${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: ecom-redis
    ports:
      - "${REDIS_HOST_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # M3 background jobs (opt-in): docker compose --profile jobs up worker beat
  worker:
    build: .
    container_name: ecom-worker
    command: celery -A app.worker.celery worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://ecom:ecom@db:5432/ecom
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /code
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/code/app
    profiles: ["jobs"]

  beat:
    build: .
    container_name: ecom-beat
    command: celery -A app.worker.celery beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://ecom:ecom@db:5432/ecom
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /code
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./app:/code/app
    profiles: ["jobs"]

  # M3 observability (opt-in): docker compose --profile monitoring up prometheus grafana
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ecom-prometheus
    ports:
      - "${PROM_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ecom-grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    profiles: ["monitoring"]

volumes:
  pgdata:
