name: CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ecom
          POSTGRES_PASSWORD: ecom
          POSTGRES_DB: ecom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecom"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://ecom:ecom@localhost:5432/ecom
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
      SECRET_KEY: ci-secret-key-for-tests-only-min-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: pytest -q --cov=app --cov-report=term --cov-fail-under=80
      - run: python -m compileall -q app

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ecom-api:${{ github.sha }} .
      - run: docker compose config --quiet
